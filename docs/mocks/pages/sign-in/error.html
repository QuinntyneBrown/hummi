<main id="main" class="auth-layout"><div class="auth-card"><div class="logo"><img class="brand-logo brand-logo--light" src="../../assets/brand/hummi-wordmark-coral.svg" alt="Hummi"><img class="brand-logo brand-logo--dark" src="../../assets/brand/hummi-wordmark-cream.svg" alt="" aria-hidden="true"></div><div class="card stack"><div><h1 style="font:var(--text-h2)">Welcome back</h1><p class="text-muted" style="margin-top:var(--space-1)">Sign in to pick up where you left off.</p></div><form class="stack" novalidate><div class="alert alert--danger" role="alert"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19zM12 10v4M12 17v.5"/></svg><div class="alert__body"><div class="alert__title">That email and password don’t match</div><div>Check both and try again, or <a href="../reset-password/default.html">reset your password</a>.</div></div></div><div class="field"><label class="field__label" for="email">Email</label><input class="input" id="email" name="email" type="email" value="nadia@example.com" required autocomplete="email"></div><div class="field"><label class="field__label" for="password">Password</label><input class="input" id="password" name="password" type="password" value="••••••••••" required autocomplete="current-password"></div><div class="cluster cluster--between"><label class="choice"><input type="checkbox" checked><span class="choice__text">Keep me signed in</span></label><a href="../reset-password/default.html">Forgot password?</a></div><button class="btn btn--primary btn--lg btn--block" type="submit">Sign in</button></form></div><p class="text-muted" style="margin-top:var(--space-4);text-align:center">New to Hummi? <a href="../sign-up/default.html">Create a free account</a></p></div></main>
