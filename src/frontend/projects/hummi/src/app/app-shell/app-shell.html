<header class="top-bar">
  <div class="container top-bar__inner">
    <a class="brand" routerLink="/" aria-label="Hummi home"><hm-logo variant="wordmark" /></a>
    @if (auth.user(); as user) {
      <span class="user">{{ user.displayName }}</span>
    }
  </div>
</header>
<main id="main" class="container page" tabindex="-1">
  <router-outlet />
</main>
<footer class="footer">
  <div class="container footer__inner">
    <hm-logo variant="icon" />
    <span>Free music, made in the open.</span>
  </div>
</footer>
