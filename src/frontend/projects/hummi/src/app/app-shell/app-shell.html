<hm-top-nav [links]="links" [open]="navOpen()" (menuToggle)="toggleNav()">
  @if (session.user(); as user) {
    <span class="avatar avatar--nav" role="img" [attr.aria-label]="'Account: ' + user.displayName">{{
      user.displayName.charAt(0)
    }}</span>
  } @else {
    <a class="btn" routerLink="/sign-in">Sign in</a>
    <a class="btn btn--primary" routerLink="/sign-up">Sign up</a>
  }
</hm-top-nav>
<main id="main" class="container app-main" tabindex="-1">
  <router-outlet />
  <footer class="site-footer">
    <span>Every track on Hummi is free to stream and free to share.</span>
    <span>hummi.fm — free music, made in the open.</span>
  </footer>
</main>
@if (showPlayer()) {
  @if (player.current(); as track) {
    <hm-player-bar
      [track]="track"
      [playing]="player.playing()"
      [stalled]="player.stalled()"
      [position]="player.position()"
      [duration]="player.duration()"
      (togglePlay)="player.toggle()"
      (previous)="player.previous()"
      (next)="player.next()"
    />
  }
}
